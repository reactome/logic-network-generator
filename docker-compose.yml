version: '3.8'

services:
  neo4j:
    # Bump this tag when a new Reactome release lands; the version sentinel
    # test in tests/test_reactome_version.py records what we ran against.
    image: public.ecr.aws/reactome/graphdb:Release97
    container_name: reactome-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_dbms_memory_heap_maxSize=8g
      # This image ships JDK 11, whose container-metrics probe NPEs reading
      # cgroup v2 on a newer host kernel — Neo4j then dies before startup with
      # ExceptionInInitializerError out of CgroupV2Subsystem.getInstance. The
      # heap is pinned above, so container-aware sizing buys nothing here.
      - NEO4J_dbms_jvm_additional=-XX:-UseContainerSupport
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
